name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (must match Cargo.toml, e.g. v0.1.0)'
        required: true
        type: string
      replace_assets:
        description: 'Replace changed same-name assets (prefer a new version instead)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: 'true'
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    runs-on: macos-15 # Native Apple Silicon, not an Intel cross-build.
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check version and release helpers
        run: |
          python3 -c 'import os, tomllib; v = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + v, "tag must match Cargo.toml"'
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      - name: Check and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --target aarch64-apple-darwin -- -D warnings
          cargo test --locked --target aarch64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
      - name: Package CLI and skill
        run: |
          python3 scripts/package_release.py --tag "$RELEASE_TAG" \
            --binary target/aarch64-apple-darwin/release/claw-todo --output dist
      - name: Smoke test the unpacked binary
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c SHA256SUMS)
          smoke_dir=$(mktemp -d)
          tar -xzf "dist/claw-todo-$RELEASE_TAG-darwin-arm64.tar.gz" -C "$smoke_dir"
          binary="$smoke_dir/claw-todo-$RELEASE_TAG-darwin-arm64/claw-todo"
          test "$(lipo -archs "$binary")" = arm64
          test "$("$binary" --version)" = "claw-todo ${RELEASE_TAG#v}"
          "$binary" --help
          "$binary" --db "$smoke_dir/todos.db" --json create 'Release smoke test' --category personal \
            | jq -e '.ok == true and .data.task.title == "Release smoke test"'
          "$binary" --db "$smoke_dir/todos.db" --json list \
            | jq -e '.ok == true and .data.summary.matched == 1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true # Re-running this workflow may replace its temporary artifact.

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag has not moved since the build
        env:
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$BUILD_COMMIT"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPLACE_ASSETS: ${{ inputs.replace_assets || false }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$REPLACE_ASSETS" == true ]]; then options+=(--replace-assets); fi
          python3 scripts/publish_release.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --assets dist "${options[@]}"
